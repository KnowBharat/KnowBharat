<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <link rel="icon" href="/KnowBharat.png"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="description" content="KnowBharat: An interactive educational game for kids to explore the states, culture, and symbols of India."/>

  <!-- Preconnect to font origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

  <!-- Non-blocking font load -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap"/>
  </noscript>

  <!-- Preload logo for instant LCP -->
  <link rel="preload" as="image" href="/KnowBharat.png" fetchpriority="high"/>

  <title>KnowBharat</title>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
</body>
</html>
